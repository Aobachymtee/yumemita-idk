<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yumemita Fanmade Zone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #fff9fb; }
    .brand-font { font-family: 'Comfortaa', cursive; }
  </style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-pink-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="brand-font text-2xl font-bold text-pink-500 tracking-wide flex items-center gap-2">
        <span>✨</span> Yumemita Zone
      </a>
      <nav class="flex gap-6 font-semibold text-sm">
        <a href="#members" class="hover:text-pink-500 transition-colors">Thành Viên</a>
        <a href="#songs" class="hover:text-pink-500 transition-colors">Dịch Nhạc</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-pink-200 via-purple-200 to-indigo-200 py-12 px-4 text-center">
    <div class="max-w-3xl mx-auto">
      <h1 class="brand-font text-4xl md:text-5xl font-extrabold text-slate-800 mb-3">
        Yumemita Fanmade Base
      </h1>
      <p class="text-slate-600 text-base md:text-lg mb-6">
        Trang thông tin thành viên & thư viện lời dịch nhạc dành riêng cho Yumemita!
      </p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-10 flex-grow w-full space-y-12">
    
    <!-- Section Members -->
    <section id="members">
      <div class="flex justify-between items-center mb-6">
        <h2 class="brand-font text-2xl font-bold text-slate-800 flex items-center gap-2">
          <span class="w-3 h-8 bg-pink-400 rounded-full inline-block"></span> Thành Viên
        </h2>
      </div>
      <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- JS renders cards here -->
      </div>
    </section>

    <!-- Section Songs -->
    <section id="songs">
      <div class="flex justify-between items-center mb-6">
        <h2 class="brand-font text-2xl font-bold text-slate-800 flex items-center gap-2">
          <span class="w-3 h-8 bg-purple-400 rounded-full inline-block"></span> Dịch Nhạc (Discography)
        </h2>
      </div>
      <div id="songs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JS renders song cards here -->
      </div>
    </section>

  </main>

  <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
    <p>Yumemita Fanmade Project — Styled with Bandori Party vibe ✨</p>
  </footer>

  <script>
    fetch('data/data.json')
      .then(res => res.json())
      .then(data => {
        // Render Members
        const membersContainer = document.getElementById('members-grid');
        membersContainer.innerHTML = data.members.map(m => `
          <a href="character.html?id=${m.id}" class="bg-white rounded-3xl p-4 border border-pink-100 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 block group">
            <div class="relative overflow-hidden rounded-2xl mb-3 aspect-square bg-pink-50">
              <img src="${m.image}" alt="${m.name}" class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-300">
              <span class="absolute top-2 right-2 bg-pink-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">${m.role}</span>
            </div>
            <h3 class="font-bold text-lg text-slate-800 group-hover:text-pink-500 transition-colors">${m.name}</h3>
            <p class="text-xs text-slate-400 mb-2">${m.japanese_name}</p>
            <p class="text-sm text-slate-600 line-clamp-2">${m.bio}</p>
          </a>
        `).join('');

        // Render Songs
        const songsContainer = document.getElementById('songs-grid');
        songsContainer.innerHTML = data.songs.map(s => `
          <a href="song.html?id=${s.id}" class="bg-white rounded-2xl p-4 border border-slate-100 flex gap-4 items-center hover:border-purple-300 hover:shadow-md transition-all shadow-sm group">
            <div class="w-20 h-20 bg-purple-100 rounded-xl flex-shrink-0 overflow-hidden">
              <img src="${s.cover}" alt="${s.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
            </div>
            <div class="flex-grow min-w-0">
              <span class="text-xs font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-md">${s.type}</span>
              <h4 class="font-bold text-slate-800 text-base mt-1 truncate group-hover:text-purple-600 transition-colors">${s.title}</h4>
              <p class="text-xs text-slate-400 truncate">${s.japanese_title}</p>
              <p class="text-xs text-slate-500 mt-1">Dịch bởi: ${s.translator}</p>
            </div>
            <span class="bg-purple-500 text-white text-xs font-bold px-3 py-2 rounded-xl group-hover:bg-purple-600 transition-colors shrink-0">
              Xem Lời
            </span>
          </a>
        `).join('');
      });
  </script>
</body>
</html>
